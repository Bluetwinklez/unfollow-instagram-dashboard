name: Diagnose reviewed Gitleaks fingerprints
on:
  push:
    branches: [security/gitleaks-reviewed-fingerprints-2026-11-19]
    paths: ['.github/workflows/diagnose-gitleaks.yml']
permissions:
  contents: read
jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned and verified scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Print fingerprints only - never print secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --log-opts="--all" --report-format=json --report-path="$RUNNER_TEMP/findings.json" --no-banner || true
          node - "$RUNNER_TEMP/findings.json" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          const v = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : [];
          for (const f of v) console.log(JSON.stringify({ fingerprint: f.Fingerprint, rule: f.RuleID, file: f.File, line: f.StartLine, commit: f.Commit }));
          console.log('Finding count:', v.length);
          NODE
